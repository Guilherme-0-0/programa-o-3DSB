<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Qual é o seu time?</title>
<style>body{font-family:Arial,sans-serif;background:#eef3f8;margin:0;padding:32px}.card{max-width:520px;margin:auto;background:#fff;border-radius:14px;box-shadow:0 4px 18px #0002;overflow:hidden}.header{background:#1261a0;color:white;padding:24px;text-align:center}.header h1{font-family:'Times New Roman',serif;font-size:36px;margin:0}.form-container{display:flex;flex-direction:column;gap:14px;padding:24px}label{font-weight:bold}select,button{font-size:16px;padding:12px;border-radius:8px}button{border:0;cursor:pointer;background:#167a58;color:white}button.secondary{background:#667085}#mensagem{font-weight:bold;min-height:24px}</style></head>
<body><main class="card"><header class="header"><h1>Qual o seu Time do Coração? ⚽</h1></header><form class="form-container" id="formTime"><label for="time">Escolha seu time:</label><select id="time" name="time"><option value="">Selecione</option><option>Corinthians</option><option>Palmeiras</option><option>Santos</option><option>São Paulo</option></select><div><button type="submit">Confirmar</button> <button type="reset" class="secondary">Cancelar</button></div><p id="mensagem" aria-live="polite"></p></form></main>
<script>const formulario=document.getElementById('formTime');const select=document.getElementById('time');const mensagem=document.getElementById('mensagem');formulario.addEventListener('submit',function(event){event.preventDefault();const time=select.options[select.selectedIndex].value;mensagem.textContent=time?'Seu time é '+time:'Selecione um time.'});formulario.addEventListener('reset',function(){mensagem.textContent='Seleção cancelada.'});</script></body></html>
