<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastro de Clientes</title><style>*{box-sizing:border-box}body{font:16px Arial;background:#eef3f8;color:#243247;margin:0;padding:32px}.form-container{max-width:680px;margin:20px auto;background:white;padding:28px;border-radius:16px;box-shadow:0 12px 32px #1d355722}input{display:block;width:100%;padding:11px;margin:10px 0;border:1px solid #cbd5e1;border-radius:8px}button{border:0;border-radius:8px;padding:10px 14px;background:#2563eb;color:white;cursor:pointer}li{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:12px;margin:8px 0}li button:first-of-type{background:#eab308;color:#222}li button:last-of-type{background:#dc2626}</style></head><body><main class="form-container"><h2>Cadastro de Clientes</h2><input id="nome" placeholder="Nome"><input id="endereco" placeholder="Endereço"><input id="telefone" placeholder="Telefone"><button onclick="adicionarCliente()">Adicionar</button><h3>Lista de Clientes</h3><ul id="listaClientes"></ul></main><script>function carregarClientes(){const clientes=JSON.parse(localStorage.getItem('clientes')||'[]');const lista=document.getElementById('listaClientes');lista.innerHTML='';clientes.forEach((c,i)=>{const li=document.createElement('li');li.textContent=c.nome+' - '+c.endereco+' - '+c.telefone+' ';li.innerHTML+='<button onclick="editarCliente('+i+')">Editar</button><button onclick="excluirCliente('+i+')">Excluir</button>';lista.appendChild(li)})}function adicionarCliente(){const nome=document.getElementById('nome').value.trim(),endereco=document.getElementById('endereco').value.trim(),telefone=document.getElementById('telefone').value.trim();if(!nome||!endereco||!telefone)return alert('Preencha todos os campos!');const clientes=JSON.parse(localStorage.getItem('clientes')||'[]');clientes.push({nome,endereco,telefone});localStorage.setItem('clientes',JSON.stringify(clientes));document.getElementById('nome').value='';document.getElementById('endereco').value='';document.getElementById('telefone').value='';carregarClientes()}function editarCliente(i){const clientes=JSON.parse(localStorage.getItem('clientes')||'[]');const c=clientes.splice(i,1)[0];localStorage.setItem('clientes',JSON.stringify(clientes));document.getElementById('nome').value=c.nome;document.getElementById('endereco').value=c.endereco;document.getElementById('telefone').value=c.telefone;carregarClientes()}function excluirCliente(i){const clientes=JSON.parse(localStorage.getItem('clientes')||'[]');clientes.splice(i,1);localStorage.setItem('clientes',JSON.stringify(clientes));carregarClientes()}carregarClientes();</script></body></html>
