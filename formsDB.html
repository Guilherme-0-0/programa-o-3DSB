<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastro de Clientes</title>
<style>
*{box-sizing:border-box}body{font:16px Arial,sans-serif;background:#eef3f8;color:#243247;margin:0;padding:32px}.card{max-width:760px;margin:20px auto;background:white;padding:28px;border-radius:16px;box-shadow:0 12px 32px #1d355722}h1{margin-top:0;color:#234b75}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}label{font-weight:600}input{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px;margin-top:5px}button{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:600;background:#2563eb;color:white}button:hover{filter:brightness(.94)}.secondary{background:#64748b}.edit{background:#eab308;color:#222}.delete{background:#dc2626}.actions{display:flex;gap:8px}.controls{display:flex;gap:10px;margin:18px 0;flex-wrap:wrap}.controls input{flex:1;min-width:200px;margin:0}ul{padding:0;list-style:none}li{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:12px;margin:8px 0}.msg{min-height:24px;color:#15803d;font-weight:bold}.count{font-weight:bold;color:#475569}@media(max-width:520px){body{padding:12px}.card{padding:18px}li{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="card"><h1>Cadastro de Clientes</h1><form id="form"><div class="grid"><label>Nome<input id="nome" required></label><label>Endereço<input id="endereco" required></label><label>Telefone<input id="telefone" type="tel" required></label></div><div class="controls"><button id="salvar">Adicionar</button><button type="button" id="limpar" class="secondary">Limpar</button></div></form><p id="msg" class="msg" aria-live="polite"></p><div class="controls"><input id="busca" placeholder="Buscar pelo nome"><button type="button" id="ordenar" class="secondary">Ordenar A–Z</button></div><p id="contador" class="count"></p><ul id="lista"></ul></main>
<script>
const $=id=>document.getElementById(id);let clientes=JSON.parse(localStorage.getItem('clientes')||'[]');let editando=null;
if(!clientes.length){clientes=[{nome:'Ana Souza',endereco:'Rua da Paz 44',telefone:'4123456789'},{nome:'Luis Laos',endereco:'Av. Naval 123',telefone:'4199994567'},{nome:'Tiago Lins',endereco:'Rua Porto 22',telefone:'4199882233'}];salvarBanco()}
function salvarBanco(){localStorage.setItem('clientes',JSON.stringify(clientes))}
function carregarClientes(filtro=''){const ul=$('lista');ul.innerHTML='';const f=filtro.trim().toLocaleLowerCase('pt-BR');clientes.forEach((c,i)=>{if(!c.nome.toLocaleLowerCase('pt-BR').includes(f))return;const li=document.createElement('li');const texto=document.createElement('span');texto.textContent=c.nome+' — '+c.endereco+' — '+c.telefone;const botoes=document.createElement('span');botoes.className='actions';const e=document.createElement('button');e.textContent='Editar';e.className='edit';e.type='button';e.onclick=()=>editarCliente(i);const x=document.createElement('button');x.textContent='Excluir';x.className='delete';x.type='button';x.onclick=()=>excluirCliente(i);botoes.append(e,x);li.append(texto,botoes);ul.append(li)});$('contador').textContent='Clientes cadastrados: '+clientes.length}
function limpar(){ $('form').reset();editando=null;$('salvar').textContent='Adicionar'}
function adicionarCliente(){const nome=$('nome').value.trim(),endereco=$('endereco').value.trim(),telefone=$('telefone').value.trim();if(!nome||!endereco||!telefone)return alert('Preencha todos os campos!');const c={nome,endereco,telefone};if(editando===null){clientes.push(c);$('msg').textContent='Cliente adicionado com sucesso.'}else{clientes[editando]=c;$('msg').textContent='Cliente atualizado com sucesso.'}salvarBanco();carregarClientes($('busca').value);limpar()}
function editarCliente(i){const c=clientes[i];$('nome').value=c.nome;$('endereco').value=c.endereco;$('telefone').value=c.telefone;editando=i;$('salvar').textContent='Salvar';$('nome').focus()}
function excluirCliente(i){if(confirm('Deseja excluir este cliente?')){clientes.splice(i,1);salvarBanco();carregarClientes($('busca').value);$('msg').textContent='Cliente excluído.'}}
$('form').addEventListener('submit',e=>{e.preventDefault();adicionarCliente()});$('limpar').onclick=limpar;$('busca').oninput=e=>carregarClientes(e.target.value);$('ordenar').onclick=()=>{clientes.sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));salvarBanco();carregarClientes($('busca').value)};carregarClientes();
</script></body></html>
