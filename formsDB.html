<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Clientes</title></head><body><h2>Cadastro de Clientes</h2><input id="nome" placeholder="Nome"><input id="endereco" placeholder="Endereço"><input id="telefone" placeholder="Telefone"><button onclick="adicionarCliente()">Adicionar</button><h3>Lista de Clientes</h3><ul id="listaClientes"></ul><script>function carregarClientes(){const clientes=JSON.parse(localStorage.getItem('clientes')||'[]');const lista=document.getElementById('listaClientes');lista.innerHTML='';clientes.forEach((c,i)=>{const li=document.createElement('li');li.textContent=c.nome+' - '+c.endereco+' - '+c.telefone+' ';li.innerHTML+='<button onclick="editarCliente('+i+')">Editar</button><button onclick="excluirCliente('+i+')">Excluir</button>';lista.appendChild(li)})}function adicionarCliente(){const nome=document.getElementById('nome').value.trim(),endereco=document.getElementById('endereco').value.trim(),telefone=document.getElementById('telefone').value.trim();if(!nome||!endereco||!telefone)return alert('Preencha todos os campos!');const clientes=JSON.parse(localStorage.getItem('clientes')||'[]');clientes.push({nome,endereco,telefone});localStorage.setItem('clientes',JSON.stringify(clientes));document.getElementById('nome').value='';document.getElementById('endereco').value='';document.getElementById('telefone').value='';carregarClientes()}function editarCliente(i){const clientes=JSON.parse(localStorage.getItem('clientes')||'[]');const c=clientes.splice(i,1)[0];localStorage.setItem('clientes',JSON.stringify(clientes));document.getElementById('nome').value=c.nome;document.getElementById('endereco').value=c.endereco;document.getElementById('telefone').value=c.telefone;carregarClientes()}function excluirCliente(i){const clientes=JSON.parse(localStorage.getItem('clientes')||'[]');clientes.splice(i,1);localStorage.setItem('clientes',JSON.stringify(clientes));carregarClientes()}carregarClientes();</script></body></html>
